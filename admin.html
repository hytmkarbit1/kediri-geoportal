<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/src/admin/admin.css">
</head>

<body>
    <div class="admin-container">
        <!-- Login Form (Shown if not authenticated) -->
        <div id="admin-login-container"
            style="display: none; max-width: 400px; margin: 50px auto; padding: 20px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px;">
            <h2>Admin Login</h2>
            <input type="email" id="admin-email-input" placeholder="Email"
                style="width: 100%; margin: 10px 0; padding: 8px;">
            <input type="password" id="admin-password-input" placeholder="Password"
                style="width: 100%; margin: 10px 0; padding: 8px;">
            <button id="admin-login-submit" class="btn btn-primary" style="width: 100%;">Login</button>
            <p id="login-error" style="color: red; display: none; margin-top: 10px;"></p>
        </div>

        <!-- Dashboard Content -->
        <main id="dashboard-content" class="admin-content" style="display: none;">
            <div class="header-simple"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>Admin Dashboard</h1>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <a href="/" class="btn-home"
                        style="text-decoration: none; color: white; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 6px; font-size: 0.875rem; border: 1px solid var(--border-color);">🏠
                        Home</a>
                    <span id="admin-email"></span>
                    <button id="logout-btn" class="btn btn-danger"
                        style="width: auto; display: inline-block; margin-left: 10px;">Logout</button>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="pending">Pending Review</button>
                <button class="tab-btn" data-tab="approved">Approved Data</button>
                <button class="tab-btn" data-tab="government">Government Data</button>
            </div>

            <div id="pending-tab" class="tab-content active">
                <div class="section-header">
                    <h2>Pending Submissions</h2>
                    <button id="refresh-pending" class="btn btn-secondary">Refresh</button>
                </div>
                <div id="pending-list" class="data-list">
                    <table id="pending-table" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Name</th>
                                <th>User</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div id="approved-tab" class="tab-content">
                <div class="section-header">
                    <h2>Approved Data</h2>
                    <button id="refresh-approved" class="btn btn-secondary">Refresh</button>
                </div>
                <div id="approved-list" class="data-list">
                    <table id="approved-table" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Name</th>
                                <th>User</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div id="government-tab" class="tab-content">
                <div class="section-header">
                    <h2>Government Data</h2>
                </div>
                <div class="gov-stats">
                    <table id="gov-table" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr>
                                <th>Table</th>
                                <th>Count</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>
    <script type="module" src="/src/admin/admin.js"></script>
</body>

</html>
